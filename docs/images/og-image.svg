<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="iconOuter" cx="45%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="iconInner" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed00"/>
    </radialGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Decorative dots grid -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#a78bfa"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Subtle accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#textAccent)"/>

  <!-- Icon circle left side -->
  <circle cx="220" cy="315" r="140" fill="url(#iconOuter)"/>
  <circle cx="220" cy="315" r="113" fill="#0f0f1a" opacity="0.78"/>
  <circle cx="220" cy="315" r="146" fill="url(#iconInner)" opacity="0.5"/>

  <!-- "jfsen" text -->
  <text x="440" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="700" fill="#f1f5f9" letter-spacing="-2">jfsen</text>

  <!-- Subtitle -->
  <text x="440" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#94a3b8" letter-spacing="-0.5">Code • Experimente • Hobby-Projekte</text>

  <!-- Decorative line under text -->
  <rect x="440" y="380" width="80" height="4" rx="2" fill="url(#textAccent)" opacity="0.7"/>

  <!-- Bottom right subtle mark -->
  <text x="1170" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#475569" text-anchor="end">jfsen.org</text>
</svg>
