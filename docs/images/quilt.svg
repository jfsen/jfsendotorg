<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="600" height="338" fill="url(#bg)"/>

  <!-- Glow behind quilt icon -->
  <circle cx="300" cy="140" r="100" fill="url(#glow)"/>

  <!-- Decorative blurred circles -->
  <circle cx="80" cy="280" r="80" fill="#6366f1" opacity="0.12"/>
  <circle cx="520" cy="60" r="60" fill="#06b6d4" opacity="0.15"/>

  <!-- Quilt grid icon (4 tiles, enlarged) -->
  <rect x="246" y="86" width="50" height="50" rx="8" fill="url(#tileGrad)"/>
  <rect x="304" y="86" width="50" height="50" rx="8" fill="url(#tileGrad)" opacity="0.55"/>
  <rect x="246" y="144" width="50" height="50" rx="8" fill="url(#tileGrad)" opacity="0.3"/>
  <rect x="304" y="144" width="50" height="50" rx="8" fill="url(#tileGrad)" opacity="0.75"/>

  <!-- Title -->
  <text x="300" y="250" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" letter-spacing="0.5">Quilt</text>
</svg>
